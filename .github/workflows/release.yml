name: Build and Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller pytest ruff
      - run: python -m compileall -q src calibrate.py
      - run: ruff check src tests --select E9,F63,F7,F82
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --clean JoyHarness.spec
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\JoyHarness -DestinationPath JoyHarness-windows-x64.zip
      - name: Package Apple Silicon
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          file dist/JoyHarness.app/Contents/MacOS/JoyHarness | grep arm64
          codesign --verify --deep dist/JoyHarness.app
          dist/JoyHarness.app/Contents/MacOS/JoyHarness --version
          ditto -c -k --sequesterRsrc --keepParent dist/JoyHarness.app JoyHarness-macOS-arm64.zip
          mkdir dmg-stage
          ditto dist/JoyHarness.app dmg-stage/JoyHarness.app
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname JoyHarness -srcfolder dmg-stage -ov -format UDZO JoyHarness-macOS-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: JoyHarness-${{ matrix.platform }}
          path: |
            JoyHarness-*.zip
            JoyHarness-*.dmg
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release after both builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" release-assets/* --verify-tag --title "JoyHarness $TAG · macOS Workflow Update" --notes-file docs/RELEASE.md
